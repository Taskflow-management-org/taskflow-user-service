name: ci-cd.yml
on:
  push:
    branches:
      - development
      - main
      - 'feature/**'
  pull_request:
    branches:
      - development
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build & Run Unit with Maven
        run: ./mvnw clean verify -Dspring.profiles.active=test

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/taskflow-user-service:latest
            ${{secrets.DOCKERHUB_USERNAME}}/taskflow-user-service:${{github.sha}}

  cd-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ubuntu
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            cd ~/app
            
            if [ -f docker-compose-app.yml ]; then
              echo "Pulling latest user-service image..." 
              docker compose -f docker-compose-app.yml pull user-service
            
              echo "Starting user-service container..."
              docker compose -f docker-compose-app.yml up -d user-service
            
              echo "Cleaning up old unused docker images..."
              docker system prune -f
            else
              echo "Error: docker-compose.app.yml not found in ~/app directory!"
              exit 1
            fi